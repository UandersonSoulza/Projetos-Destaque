<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos · Controle de Estoque</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">

<div id="topbar" class="topbar"></div>

<div class="page-wrap">
    <div class="container container-wide">
        <div class="page-header">
            <h2>Produtos</h2>
            <button type="button" class="btn btn-primary" id="btn-novo-produto">+ Novo Produto</button>
        </div>

        <div class="search-bar">
            <input type="text" id="busca-nome" placeholder="Buscar produto pelo nome...">
            <button type="button" class="btn btn-secondary" id="btn-buscar">Buscar</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 8%;">ID</th>
                        <th>Nome</th>
                        <th style="width: 18%;">Categoria</th>
                        <th style="width: 14%;">Quantidade</th>
                        <th style="width: 14%;">Preço</th>
                        <th style="width: 16%;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tbody-produtos">
                    <tr><td colspan="6"><div class="empty-state">Carregando produtos...</div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal de cadastro/edição de produto -->
<div class="modal-overlay" id="modal-produto">
    <div class="container container-auth">
        <div class="page-header">
            <h2 id="modal-titulo">Novo Produto</h2>
            <button type="button" class="modal-close" id="btn-fechar-modal">&times;</button>
        </div>

        <p id="form-produto-message" class="message" style="display:none;"></p>

        <form id="form-produto" autocomplete="off">
            <div class="form-group">
                <input type="text" id="name" name="name" placeholder="Nome do produto" required>
            </div>
            <div class="form-group">
                <input type="number" id="quantity" name="quantity" placeholder="Quantidade" min="0" step="1" required>
            </div>
            <div class="form-group">
                <input type="number" id="price" name="price" placeholder="Preço (R$)" min="0" step="0.01" required>
            </div>
            <div class="form-group">
                <select id="categoryId" name="categoryId">
                    <option value="">Sem categoria</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="btn-cancelar-modal">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="btn-salvar-produto">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/produtos.js"></script>

</body>
</html>
